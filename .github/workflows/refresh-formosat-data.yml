name: Refresh FORMOSAT-8A orbital data

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch the latest permitted GP record
        run: node scripts/update-formosat-data.mjs
      - name: Commit only when the data changed
        run: |
          if git diff --quiet -- public/data/formosat-8a.json; then
            echo "No GP-data change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/formosat-8a.json
          git commit -m "chore(data): refresh FORMOSAT-8A GP record"
          git push
