name: Refresh FORMOSAT-8A orbital data

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch the latest permitted GP record
        run: node scripts/update-formosat-data.mjs
      - name: Detect a changed GP record
        id: changes
        run: |
          if git diff --quiet -- public/data/formosat-8a.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit only when the data changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/formosat-8a.json
          git commit -m "chore(data): refresh FORMOSAT-8A GP record"
          git push

  deploy-pages:
    if: needs.refresh.outputs.changed == 'true'
    needs: refresh
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Include the current GP data file
        run: |
          mkdir -p docs/data
          cp public/data/formosat-8a.json docs/data/formosat-8a.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4